name: Windows build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Restore
        run: dotnet restore gspro-r10.csproj
      - name: Build
        run: dotnet build gspro-r10.csproj --configuration Release --no-restore
      - name: Publish self-contained x64
        run: dotnet publish gspro-r10.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: R10-Shot-Tracker-Windows-x64
          path: publish/win-x64/
